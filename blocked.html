<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Site Blocked - Study First!</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 2.5em;
      margin: 0 0 20px 0;
    }
    .icon {
      font-size: 4em;
      margin-bottom: 20px;
    }
    .message {
      font-size: 1.2em;
      margin: 20px 0;
      line-height: 1.6;
    }
    .progress {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      height: 30px;
      margin: 20px 0;
      overflow: hidden;
    }
    .progress-bar {
      background: linear-gradient(90deg, #00f260, #0575e6);
      height: 100%;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .time-left {
      font-size: 2em;
      font-weight: bold;
      margin: 20px 0;
      font-family: monospace;
    }
    .sites {
      margin: 20px 0;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    .site-link {
      display: block;
      color: #fff;
      text-decoration: none;
      padding: 10px;
      margin: 5px 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      transition: background 0.3s ease;
    }
    .site-link:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚫</div>
    <h1>Focus on Your Goals!</h1>
    <div class="message">
      This site is blocked until you complete 1 hour of study time on your goal websites.
    </div>
    <div class="progress">
      <div class="progress-bar" id="progressBar" style="width: 0%">
        0%
      </div>
    </div>
    <div class="time-left" id="timeLeft">
      Time Remaining: 01:00:00
    </div>
    <div class="sites">
      <strong>Study on these sites:</strong><br><br>
      <a href="https://app.hackthebox.com" class="site-link">🎯 HackTheBox</a>
      <a href="https://www.freecodecamp.org" class="site-link">💻 FreeCodeCamp</a>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
