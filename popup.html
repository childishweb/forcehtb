<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Study Enforcer</title>
  <style>
    body {
      width: 250px;
      font-family: monospace;
      font-size: 12px;
      margin: 0;
      padding: 10px;
    }
    p {
      margin: 5px 0;
    }
    a {
      color: #00f;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <p id="status">Loading...</p>
  <p id="progress">0%</p>
  <p id="timeStudied">Studied: 00:00:00</p>
  <p id="timeRemaining">Remaining: 01:00:00</p>
  <p id="cycleReset">Cycle resets in: 04:00:00</p>
  <p><a href="https://app.hackthebox.com" target="_blank">hackthebox.com</a></p>
  <p><a href="https://www.freecodecamp.org" target="_blank">freecodecamp.org</a></p>
  <script src="popup.js"></script>
</body>
</html>
