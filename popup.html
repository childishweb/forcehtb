<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Study Time Enforcer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 Study Time Enforcer</h1>
    </div>

    <div class="status" id="status">
      <div class="status-icon" id="statusIcon">⏱️</div>
      <div class="status-text" id="statusText">Loading...</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label" id="progressLabel">0%</div>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Time Studied</div>
        <div class="stat-value" id="timeStudied">00:00:00</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Time Remaining</div>
        <div class="stat-value" id="timeRemaining">01:00:00</div>
      </div>
    </div>

    <div class="goal-sites">
      <div class="section-title">Goal Websites:</div>
      <div class="site-list">
        <a href="https://app.hackthebox.com" target="_blank" class="site-button">
          🎯 HackTheBox
        </a>
        <a href="https://www.freecodecamp.org" target="_blank" class="site-button">
          💻 FreeCodeCamp
        </a>
      </div>
    </div>

    <div class="footer">
      <small>Complete 1 hour on goal sites to unlock all websites</small>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
