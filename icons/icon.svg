<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>

  <!-- Book -->
  <rect x="35" y="40" width="58" height="50" rx="4" fill="white"/>
  <rect x="35" y="40" width="29" height="50" rx="4" fill="#e0e0e0"/>
  <line x1="64" y1="40" x2="64" y2="90" stroke="#999" stroke-width="2"/>

  <!-- Clock hands -->
  <circle cx="64" cy="60" r="18" fill="transparent" stroke="white" stroke-width="3"/>
  <line x1="64" y1="60" x2="64" y2="50" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="60" x2="70" y2="60" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="60" r="2" fill="white"/>
</svg>
